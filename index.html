<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>공주네 기프티콘 보관함 🎁</title>

  <!-- PWA & 모바일 홈 화면 설정 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="쿠폰보관함🎁" />
  <meta name="theme-color" content="#6c5ce7" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:wrapped-gift.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:wrapped-gift.svg" />

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #6c5ce7;
      --primary-soft: #ede9fe;
      --primary-dark: #5b4bc4;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
      color: white;
      padding: 26px 20px 20px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.35rem; font-weight: 700; }
    .count-pill {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 16px; }

    /* Sync Indicator */
    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      justify-content: flex-end;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; transition: background 0.3s; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    /* Controls */
    .filter-sort-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .sub-tabs { display: flex; gap: 6px; }
    .sub-tab-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    }
    .sort-select {
      padding: 7px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      color: #57606f;
      background: white;
      outline: none;
    }

    /* Gifticon Card Grid */
    .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .gift-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .gift-card.used { opacity: 0.55; filter: grayscale(80%); }
    .gift-img-wrap {
      height: 135px;
      background: #f8f9fc;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
    }
    .gift-img-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
    .gift-dday-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .gift-dday-badge.urgent { background: #ff4757; }

    .gift-quick-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }
    .gift-action-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      cursor: pointer;
      color: #57606f;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .gift-action-btn:hover { background: white; }
    .gift-action-btn.del { color: #ff4757; }

    .gift-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .gift-brand { font-size: 0.75rem; color: var(--primary); font-weight: 700; }
    .gift-name { font-size: 0.88rem; font-weight: 700; color: #2d3436; margin: 2px 0 8px; line-height: 1.3; }
    .gift-memo { font-size: 0.75rem; color: #a4b0be; margin-bottom: 8px; }
    .gift-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .btn-toggle-use {
      background: #f1f2f6;
      border: none;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: #57606f;
    }
    .btn-toggle-use.is-used { background: #2ed573; color: white; }

    /* Floating Button */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.4);
      cursor: pointer;
      border: none;
      z-index: 50;
      transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      z-index: -1;
      opacity: 0;
      pointer-events: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { display: flex; z-index: 999; opacity: 1; pointer-events: auto; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    .form-control { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.9rem; outline: none; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }

    /* Image View Modal */
    .gift-view-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      position: relative;
    }
    .gift-modal-close-btn {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 32px;
      height: 32px;
      background: #2d3436;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    .gift-view-img-box {
      width: 100%;
      max-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: #fafafa;
    }
    .gift-view-img-box img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-top">
      <div>
        <div class="header-title">우리만의 기프티콘함 🎁</div>
        <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">함께 쓰는 모바일 쿠폰 보관소</p>
      </div>
      <div class="count-pill">
        <i class="fa-solid fa-ticket"></i>
        <span id="couponCount">0개 보유</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncStatusText">서버 연결 중...</span>
    </div>

    <!-- Filter & Sort -->
    <div class="filter-sort-row">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="filterGifticons('available', this)">사용 가능</button>
        <button class="sub-tab-btn" onclick="filterGifticons('all', this)">전체</button>
        <button class="sub-tab-btn" onclick="filterGifticons('used', this)">사용 완료</button>
      </div>
      <select class="sort-select" id="sortSelect" onchange="renderGifticons()">
        <option value="dday">⏰ 유효기간 임박순</option>
        <option value="dday_desc">⏳ 유효기간 여유순</option>
        <option value="name">🔤 이름 가나다순</option>
        <option value="recent">🆕 최신 등록순</option>
      </select>
    </div>

    <!-- Cards Grid -->
    <div class="gift-grid" id="gifticonContainer"></div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openAddModal()">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 style="font-size: 1.15rem; margin-bottom: 16px;" id="modalTitle">새 기프티콘 추가</h3>
      <input type="hidden" id="editItemId" value="">

      <div class="form-group">
        <label>바코드/쿠폰 사진</label>
        <input type="file" class="form-control" id="giftImage" accept="image/*">
      </div>

      <div class="form-group">
        <label>브랜드명</label>
        <input type="text" class="form-control" id="giftBrand" placeholder="예: 스타벅스, 올리브영, BHC">
      </div>

      <div class="form-group">
        <label>상품명</label>
        <input type="text" class="form-control" id="itemName" placeholder="예: 아메리카노 T 2잔 + 생크림카스텔라">
      </div>

      <div class="form-group">
        <label>유효기간</label>
        <input type="date" class="form-control" id="giftDueDate">
      </div>

      <div class="form-group">
        <label>메모 (선택)</label>
        <textarea class="form-control" id="itemMemo" rows="2" placeholder="쿠폰 번호, 사용처 조건 등"></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="saveItem()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Image Modal -->
  <div class="modal-overlay" id="imgViewModal" onclick="closeImgModal()">
    <div class="gift-view-card" onclick="event.stopPropagation()">
      <button class="gift-modal-close-btn" onclick="closeImgModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="gift-view-img-box">
        <img id="enlargedImg" src="" alt="기프티콘 바코드">
      </div>
    </div>
  </div>

  <script>
    // 기존 Firebase 설정 그대로 유지
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let gifticons = [];
    let currentGiftFilter = 'available';
    let editingGifticonExistingImg = null;

    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncStatusText');

    // 기프티콘 전용 독립 문서(only_gifticons)에 저장/동기화
    db.collection("couple_space").doc("only_gifticons").onSnapshot({
      includeMetadataChanges: true
    }, (doc) => {
      if (doc.exists) {
        gifticons = doc.data().items || [];
      } else {
        gifticons = [];
        db.collection("couple_space").doc("only_gifticons").set({ items: [] });
      }
      syncDot.className = 'sync-dot online';
      syncText.innerText = '실시간 동기화 완료';
      renderGifticons();
    }, (error) => {
      console.error("Firestore sync error:", error);
      syncDot.className = 'sync-dot';
      syncText.innerText = '연결 오류 (규칙 확인 필요)';
    });

    function saveData() {
      syncDot.className = 'sync-dot syncing';
      syncText.innerText = '저장 중...';
      db.collection("couple_space").doc("only_gifticons").set({ items: gifticons })
        .then(() => {
          syncDot.className = 'sync-dot online';
          syncText.innerText = '실시간 동기화 완료';
        })
        .catch(err => {
          console.error("Firestore Save Error:", err);
          syncDot.className = 'sync-dot';
          syncText.innerText = '저장 실패';
        });
    }

    function filterGifticons(type, btn) {
      currentGiftFilter = type;
      document.querySelectorAll('.sub-tabs .sub-tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderGifticons();
    }

    function getGiftDDay(dateStr) {
      if (!dateStr) return { text: '기한없음', urgent: false };
      const today = new Date();
      today.setHours(0,0,0,0);
      const due = new Date(dateStr);
      due.setHours(0,0,0,0);
      const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      
      if (diff < 0) return { text: '만료됨', urgent: true };
      if (diff === 0) return { text: '오늘 마감!', urgent: true };
      return { text: `D-${diff}`, urgent: diff <= 7 };
    }

    function renderGifticons() {
      const container = document.getElementById('gifticonContainer');
      let list = [...gifticons];
      
      // 보유 개수 뱃지 갱신
      const activeCount = gifticons.filter(g => !g.isUsed).length;
      document.getElementById('couponCount').innerText = `${activeCount}개 보유`;

      if (currentGiftFilter === 'available') list = list.filter(g => !g.isUsed);
      if (currentGiftFilter === 'used') list = list.filter(g => g.isUsed);

      const sortType = document.getElementById('sortSelect').value;
      if (sortType === 'dday') {
        list.sort((a, b) => {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return new Date(a.dueDate) - new Date(b.dueDate);
        });
      } else if (sortType === 'dday_desc') {
        list.sort((a, b) => {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return new Date(b.dueDate) - new Date(a.dueDate);
        });
      } else if (sortType === 'name') {
        list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      } else if (sortType === 'recent') {
        list.sort((a, b) => (b.id || 0) - (a.id || 0));
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align:center; padding: 60px 10px; color:#a4b0be;">
            <i class="fa-solid fa-gift" style="font-size:3rem; margin-bottom:14px; color:#c7d2fe;"></i>
            <p style="font-size:0.95rem; font-weight:700; color:#4b5563;">보관된 기프티콘이 없습니다.</p>
            <p style="font-size:0.82rem; margin-top:6px;">우측 하단의 <b>+</b> 버튼을 눌러 새 쿠폰을 추가해보세요!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(g => {
        const dday = getGiftDDay(g.dueDate);
        return `
          <div class="gift-card ${g.isUsed ? 'used' : ''}">
            <div class="gift-quick-actions">
              <button class="gift-action-btn" title="수정" onclick="editGifticon(${g.id})">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="gift-action-btn del" title="삭제" onclick="deleteGifticon(${g.id})">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
            <div class="gift-img-wrap" onclick="viewImage('${g.img || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400'}')">
              <img src="${g.img || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400'}" alt="쿠폰">
              <div class="gift-dday-badge ${dday.urgent ? 'urgent' : ''}">${g.isUsed ? '사용완료' : dday.text}</div>
            </div>
            <div class="gift-body">
              <div>
                <div class="gift-brand">${g.brand || '기타'}</div>
                <div class="gift-name">${g.name || '이름 없음'}</div>
                ${g.memo ? `<div class="gift-memo">${g.memo}</div>` : ''}
              </div>
              <div class="gift-footer">
                <span style="font-size:0.72rem; color:#a4b0be;">~${g.dueDate || '무기한'}</span>
                <button class="btn-toggle-use ${g.isUsed ? 'is-used' : ''}" onclick="toggleGiftUse(${g.id})">
                  ${g.isUsed ? '취소' : '사용'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleGiftUse(id) {
      const g = gifticons.find(item => item.id === id);
      if (g) {
        g.isUsed = !g.isUsed;
        saveData();
        renderGifticons();
      }
    }

    function deleteGifticon(id) {
      if (confirm('이 기프티콘을 삭제할까요?')) {
        gifticons = gifticons.filter(g => g.id !== id);
        saveData();
        renderGifticons();
      }
    }

    function editGifticon(id) {
      const g = gifticons.find(item => item.id === id);
      if (!g) return;

      document.getElementById('modalTitle').innerText = '기프티콘 수정';
      document.getElementById('editItemId').value = g.id;
      document.getElementById('giftBrand').value = g.brand || '';
      document.getElementById('giftDueDate').value = g.dueDate || '';
      document.getElementById('itemName').value = g.name || '';
      document.getElementById('itemMemo').value = g.memo || '';
      editingGifticonExistingImg = g.img || null;

      document.getElementById('addModal').classList.add('active');
    }

    function viewImage(src) {
      document.getElementById('enlargedImg').src = src;
      document.getElementById('imgViewModal').classList.add('active');
    }
    function closeImgModal() {
      document.getElementById('imgViewModal').classList.remove('active');
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = '새 기프티콘 추가';
      document.getElementById('editItemId').value = '';
      editingGifticonExistingImg = null;
      document.getElementById('addModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('itemName').value = '';
      document.getElementById('itemMemo').value = '';
      document.getElementById('giftBrand').value = '';
      document.getElementById('giftDueDate').value = '';
      document.getElementById('giftImage').value = '';
      document.getElementById('editItemId').value = '';
      editingGifticonExistingImg = null;
    }

    function compressAndSaveImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveItem() {
      const editId = document.getElementById('editItemId').value;
      const brand = document.getElementById('giftBrand').value.trim() || '기타';
      const name = document.getElementById('itemName').value.trim();
      const dueDate = document.getElementById('giftDueDate').value;
      const memo = document.getElementById('itemMemo').value.trim();
      const fileInput = document.getElementById('giftImage');

      if (!name) return alert('상품명을 입력해주세요!');

      if (editId) {
        const targetIndex = gifticons.findIndex(g => g.id === parseInt(editId));
        if (targetIndex > -1) {
          if (fileInput.files && fileInput.files[0]) {
            compressAndSaveImage(fileInput.files[0], function(compressedBase64) {
              gifticons[targetIndex].brand = brand;
              gifticons[targetIndex].name = name;
              gifticons[targetIndex].dueDate = dueDate;
              gifticons[targetIndex].memo = memo;
              gifticons[targetIndex].img = compressedBase64;
              saveData();
              renderGifticons();
              closeModal();
            });
            return;
          } else {
            gifticons[targetIndex].brand = brand;
            gifticons[targetIndex].name = name;
            gifticons[targetIndex].dueDate = dueDate;
            gifticons[targetIndex].memo = memo;
            saveData();
            renderGifticons();
            closeModal();
            return;
          }
        }
      }

      if (fileInput.files && fileInput.files[0]) {
        compressAndSaveImage(fileInput.files[0], function(compressedBase64) {
          gifticons.push({
            id: Date.now(),
            brand: brand,
            name: name,
            dueDate: dueDate,
            memo: memo,
            isUsed: false,
            img: compressedBase64
          });
          saveData();
          renderGifticons();
          closeModal();
        });
      } else {
        gifticons.push({
          id: Date.now(),
          brand: brand,
          name: name,
          dueDate: dueDate,
          memo: memo,
          isUsed: false,
          img: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400'
        });
        saveData();
        renderGifticons();
        closeModal();
      }
    }

    renderGifticons();
  </script>
</body>
